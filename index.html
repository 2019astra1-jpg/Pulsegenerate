<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseGenerateImage - ИИ Студия</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: #13131a;
            --accent-purple: #9d4edd;
            --accent-neon: #e0aaff;
            --text-color: #f8f9fa;
            --text-muted: #8c8c9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Эпичный живой фон со вспышками грозы */
        .lightning-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 30%, #1a0933 0%, #0b0b0e 70%);
            opacity: 0.8;
        }

        .lightning-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(157, 78, 221, 0.0);
            animation: lightning-flash 7s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes lightning-flash {
            0%, 92%, 94%, 96%, 100% { background: rgba(157, 78, 221, 0.0); }
            93% { background: rgba(224, 170, 255, 0.12); filter: blur(2px); }
            95% { background: rgba(157, 78, 221, 0.08); }
        }

        header {
            background: rgba(19, 19, 26, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(157, 78, 221, 0.2);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--accent-purple), var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(157, 78, 221, 0.4);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--text-color);
            border-color: rgba(157, 78, 221, 0.3);
            background: rgba(157, 78, 221, 0.05);
        }

        .tab-btn.active {
            color: var(--text-color);
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .app-panel {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .app-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .studio-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .studio-layout { grid-template-columns: 1fr; }
        }

        .control-box, .result-box {
            background: var(--panel-bg);
            border: 1px solid rgba(157, 78, 221, 0.15);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .box-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent-neon);
            border-left: 3px solid var(--accent-purple);
            padding-left: 10px;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 140px;
            background: #1a1a24;
            border: 1px solid rgba(157, 78, 221, 0.2);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus { border-color: var(--accent-purple); }

        .style-select {
            width: 100%;
            background: #1a1a24;
            border: 1px solid rgba(157, 78, 221, 0.2);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            cursor: pointer;
            outline: none;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple), #7b2cbf);
            color: var(--text-color);
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.3);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.5);
        }

        .generate-btn:disabled {
            background: #3a3a4a;
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .preview-container {
            width: 100%;
            aspect-ratio: 1/1;
            background: #16161f;
            border: 2px dashed rgba(157, 78, 221, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top-color: var(--accent-purple);
            border-bottom-color: var(--accent-neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: var(--panel-bg);
            border: 1px solid rgba(157, 78, 221, 0.1);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: var(--accent-purple);
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
        }

        .gallery-info {
            padding: 12px;
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="lightning-bg"></div>

    <header>
        <div class="logo">PulseGen</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('studio')">ИИ Студия</button>
            <button class="tab-btn" onclick="switchTab('gallery')">Галерея</button>
        </div>
    </header>

    <div class="container">
        <div id="studio-panel" class="app-panel active">
            <div class="studio-layout">
                <div class="control-box">
                    <div class="box-title">Параметры генерации</div>
                    <div class="form-group">
                        <label for="prompt">Текстовый запрос (Промпт)</label>
                        <textarea id="prompt">Vibrant 2D cartoon animation artwork. Rick Sanchez from Rick and Morty, exact show style, clean black ink lineart, solid color fill, absolutely no face shadows. Expression of pure shock, huge round cartoon white eyes with tiny dot pupils, wide open mouth. Bright cyan blue spiky hair. Wearing his white lab coat and blue shirt. The background is a masterfully detailed cosmic storm: massive, intense, blinding neon purple and white lightning bolts bursting in the exact shape of a large heart. Thick, luminous, voluminous purple smoke and glowing neon fog swirling dynamically at the bottom of the frame. High contrast, electric atmosphere, rich vivid colors, crisp details. NO 3D, NO REALISM, FLAT CHARACTER.</textarea>
                    </div>
                    <div class="form-group">
                        <label for="style">Визуальный стиль</label>
                        <select id="style" class="style-select">
                            <option value="cartoon">Мультфильм / 2D Cartoon (Канон)</option>
                            <option value="cyberpunk">Киберпанк / Неоновые эффекты</option>
                            <option value="fantasy">Эпичное Фэнтези / Реализм</option>
                        </select>
                    </div>
                    <button id="gen-btn" class="generate-btn" onclick="generateImage()">Генерировать шедевр</button>
                </div>

                <div class="result-box">
                    <div class="box-title">Результат генерации</div>
                    <div class="preview-container">
                        <div id="loader" class="loader"></div>
                        <div id="placeholder" class="placeholder-text">Нажмите «Генерировать шедевр», чтобы ИИ создал новое изображение</div>
                        <img id="output-img" class="preview-img" src="" alt="Результат">
                    </div>
                </div>
            </div>
        </div>

        <div id="gallery-panel" class="app-panel">
            <div class="gallery-grid" id="gallery-container"></div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.app-panel').forEach(panel => panel.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`${tabId}-panel`).classList.add('active');
            if(tabId === 'gallery') renderGallery();
        }

        async function generateImage() {
            const promptText = document.getElementById('prompt').value;
            const styleSelect = document.getElementById('style').value;
            const genBtn = document.getElementById('gen-btn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder');
            const outputImg = document.getElementById('output-img');

            if (!promptText.trim()) return;

            genBtn.disabled = true;
            genBtn.innerText = "ИИ создает арт...";
            placeholder.style.display = "none";
            outputImg.style.display = "none";
            loader.style.display = "block";

            let finalPrompt = promptText;
            if (styleSelect === 'cyberpunk') finalPrompt += ", cyberpunk aesthetic, ultra neon lighting";
            if (styleSelect === 'fantasy') finalPrompt += ", fantasy concept art, intricate digital painting";
            
            const randomSeed = Math.floor(Math.random() * 1000000);
            const apiUrl = `https://image.pollinations.ai/p/${encodeURIComponent(finalPrompt)}?width=768&height=768&seed=${randomSeed}&nologo=true`;

            try {
                const img = new Image();
                img.src = apiUrl;
                img.onload = function() {
                    loader.style.display = "none";
                    outputImg.src = apiUrl;
                    outputImg.style.display = "block";
                    saveToLocalGallery(apiUrl, promptText);
                    genBtn.disabled = false;
                    genBtn.innerText = "Генерировать шедевр";
                };
            } catch (error) {
                alert("Ошибка соединения с ИИ. Попробуйте еще раз.");
                loader.style.display = "none";
                placeholder.style.display = "block";
                genBtn.disabled = false;
                genBtn.innerText = "Генерировать шедевр";
            }
        }

        function saveToLocalGallery(url, prompt) {
            let items = JSON.parse(localStorage.getItem('my_ai_gallery')) || [];
            items.unshift({ url: url, prompt: prompt });
            localStorage.setItem('my_ai_gallery', JSON.stringify(items));
        }

        function renderGallery() {
            const container = document.getElementById('gallery-container');
            let items = JSON.parse(localStorage.getItem('my_ai_gallery')) || [];
            if(items.length === 0) {
                items = [{ url: "https://i.postimg.cc/mDtb3qLg/rick-heart.png", prompt: "Оригинальный Рик Санчез" }];
            }
            container.innerHTML = items.map(item => `
                <div class="gallery-item" onclick="window.open('${item.url}', '_blank')">
                    <img src="${item.url}" alt="AI Art">
                    <div class="gallery-info">${item.prompt}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
