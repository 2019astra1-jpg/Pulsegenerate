<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseGenerate</title>
    <style>
        :root {
            --bg-color: #050409;
            --panel-bg: rgba(15, 12, 28, 0.65);
            --accent-bright: #b5179e;
            --border-neon: rgba(157, 78, 221, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: #f3f0fc; font-family: sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .cosmic-bg { position: fixed; inset: 0; z-index: -3; background: linear-gradient(180deg, #090514 0%, #040209 100%); }
        
        /* Живые неоновые вспышки грозы */
        .lightning-storm { position: fixed; inset: 0; z-index: -2; pointer-events: none; animation: flash 5s infinite ease-in-out; }
        @keyframes flash { 0%, 90%, 94%, 96%, 100% { background: rgba(0,0,0,0); } 92% { background: rgba(157, 78, 221, 0.15); filter: blur(4px); } 95% { background: rgba(181, 23, 158, 0.08); } }
        .fog-bottom { position: fixed; bottom: 0; left: 0; width: 100%; height: 30vh; z-index: -1; background: linear-gradient(to top, rgba(123, 44, 191, 0.15), transparent); filter: blur(15px); pointer-events: none; }
        
        /* Рамка под арт */
        .art-card { background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-neon); border-radius: 24px; padding: 25px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); max-width: 500px; width: 92%; text-align: center; }
        .art-title { font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; background: linear-gradient(45deg, #e0aaff, #b5179e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .image-wrapper { width: 100%; aspect-ratio: 1/1; background: #06040a; border-radius: 16px; overflow: hidden; box-shadow: 0 0 30px rgba(123, 44, 191, 0.2); }
        .main-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Кнопка */
        .action-btn { display: inline-block; width: 100%; background: linear-gradient(135deg, #7b2cbf, #5a189a); color: #fff; border: 1px solid rgba(224, 170, 255, 0.3); padding: 16px; font-size: 14px; font-weight: 800; border-radius: 12px; cursor: pointer; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; margin-top: 25px; transition: all 0.3s; }
        .action-btn:hover { background: linear-gradient(135deg, var(--accent-bright), #7b2cbf); box-shadow: 0 6px 25px rgba(181, 23, 158, 0.6); }
    </style>
</head>
<body>
    <div class="cosmic-bg"></div>
    <div class="lightning-storm"></div>
    <div class="fog-bottom"></div>

    <div class="art-card">
        <div class="art-title">PulseGenerate</div>
        <div class="image-wrapper">
            <!-- Твой личный шедевр -->
            <img class="main-img" src="https://i.postimg.cc/fL4BDzL2/photo-2026-09-16-11-45-40-upscaled.jpg" alt="Rick Sanchez Art">
        </div>
        <a class="action-btn" href="https://i.postimg.cc/fL4BDzL2/photo-2026-09-16-11-45-40-upscaled.jpg" target="_blank" download="rick-art.png">Скачать в Full HD</a>
    </div>
</body>
</html>
