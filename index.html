<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseGenerate - Эпичная ИИ Студия</title>
    <style>
        :root {
            --bg-color: #050409;
            --panel-bg: rgba(15, 12, 28, 0.75);
            --accent-purple: #7b2cbf;
            --accent-bright: #b5179e;
            --neon-glow: #e0aaff;
            --text-color: #f3f0fc;
            --text-muted: #7a7593;
            --border-neon: rgba(157, 78, 221, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; min-height: 100vh; }
        .cosmic-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; background: linear-gradient(180deg, #090514 0%, #040209 100%); }
        .lightning-storm { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: radial-gradient(circle at 30% 20%, rgba(123, 44, 191, 0.15) 0%, transparent 60%); pointer-events: none; animation: lightning-strike 5s infinite ease-in-out; }
        @keyframes lightning-strike { 0%, 88%, 91%, 93%, 100% { opacity: 0; filter: blur(0px); } 89% { opacity: 1; background: radial-gradient(circle at 30% 20%, rgba(224, 170, 255, 0.25) 0%, transparent 70%); filter: blur(2px); } 90% { opacity: 0.3; } 92% { opacity: 0.8; background: radial-gradient(circle at 40% 30%, rgba(181, 23, 158, 0.2) 0%, transparent 60%); } }
        .fog-bottom { position: fixed; bottom: 0; left: 0; width: 100vw; height: 30vh; z-index: -1; background: linear-gradient(to top, rgba(123, 44, 191, 0.12), transparent); filter: blur(20px); pointer-events: none; animation: fog-wave 8s infinite ease-in-out alternate; }
        @keyframes fog-wave { 0% { transform: scaleY(1) translateY(0); opacity: 0.7; } 100% { transform: scaleY(1.2) translateY(-10px); opacity: 0.9; } }
        header { background: rgba(10, 7, 20, 0.6); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border-neon); padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 5px 25px rgba(0,0,0,0.4); }
        .logo { font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; background: linear-gradient(45deg, #e0aaff, #b5179e, #7b2cbf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 25px rgba(181, 23, 158, 0.6); }
        .nav-tabs { display: flex; gap: 15px; }
        .tab-btn { background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 10px 24px; font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px; }
        .tab-btn:hover { color: #fff; border-color: rgba(224, 170, 255, 0.3); background: rgba(123, 44, 191, 0.1); }
        .tab-btn.active { color: #fff; background: linear-gradient(135deg, var(--accent-purple), var(--accent-bright)); border-color: var(--neon-glow); box-shadow: 0 0 20px rgba(181, 23, 158, 0.6), inset 0 0 8px rgba(255,255,255,0.3); }
        .container { max-width: 1400px; margin: 50px auto; padding: 0 30px; }
        .app-panel { display: none; animation: panelShow 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .app-panel.active { display: block; }
        @keyframes panelShow { from { opacity: 0; transform: translateY(15px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .studio-layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; }
        @media (max-width: 1000px) { .studio-layout { grid-template-columns: 1fr; } }
        .control-box, .result-box { background: var(--panel-bg); backdrop-filter: blur(10px); border: 1px solid var(--border-neon); border-radius: 20px; padding: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 0 20px rgba(157, 78, 221, 0.05); display: flex; flex-direction: column; }
        .box-title { font-size: 20px; font-weight: 800; margin-bottom: 30px; color: var(--neon-glow); letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .box-title::before { content: ''; width: 5px; height: 22px; background: linear-gradient(to bottom, var(--accent-bright), var(--accent-purple)); border-radius: 4px; display: inline-block; }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #d8bbff; text-transform: uppercase; letter-spacing: 1px; }
        textarea { width: 100%; height: 180px; background: rgba(12, 9, 24, 0.9); border: 1px solid rgba(157, 78, 221, 0.3); border-radius: 12px; padding: 16px; color: var(--text-color); font-family: inherit; font-size: 14.5px; line-height: 1.6; resize: none; outline: none; transition: all 0.3s; }
        textarea:focus { border-color: var(--accent-bright); box-shadow: 0 0 15px rgba(181, 23, 158, 0.3); }
        .style-select { width: 100%; background: rgba(12, 9, 24, 0.9); border: 1px solid rgba(157, 78, 221, 0.3); border-radius: 12px; padding: 16px; color: var(--text-color); cursor: pointer; outline: none; font-size: 15px; font-weight: 600; }
        .generate-btn { width: 100%; background: linear-gradient(135deg, #9d4edd, #b5179e, #7b2cbf); background-size: 200% auto; color: var(--text-color); border: none; padding: 18px; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.4s ease; box-shadow: 0 5px 25px rgba(181, 23, 158, 0.4); letter-spacing: 1px; text-transform: uppercase; margin-top: auto; }
        .generate-btn:hover { background-position: right center; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(181, 23, 158, 0.8); }
        .generate-btn:disabled { background: #221d30; color: var(--text-muted); cursor: not-allowed; }
        .preview-container { width: 100%; aspect-ratio: 1/1; background: #06040a; border: 2px dashed rgba(181, 23, 158, 0.3); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .preview-img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .preview-container.active .preview-img { display: block; filter: drop-shadow(0 0 30px rgba(157, 78, 221, 0.6)); }
        .placeholder-text { color: var(--text-muted); text-align: center; padding: 40px; font-size: 14.5px; line-height: 1.7; }
        .loader { display: none; width: 70px; height: 70px; border: 4px solid transparent; border-top-color: #b5179e; border-bottom-color: #e0aaff; border-radius: 50%; animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .action-buttons { display: flex; margin-top: 25px; width: 100%; }
        .download-btn { display: none; width: 100%; background: rgba(181, 23, 158, 0.1); color: #fff; border: 1px solid rgba(224, 170, 255, 0.4); padding: 15px; text-align: center; text-decoration: none; font-weight: 700; border-radius: 10px; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .download-btn:hover { background: rgba(181, 23, 158, 0.3); box-shadow: 0 0 25px rgba(181, 23, 158, 0.5); }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .gallery-item { background: var(--panel-bg); border: 1px solid var(--border-neon); border-radius: 18px; overflow: hidden; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer; }
        .gallery-item:hover { transform: translateY(-8px) scale(1.02); border-color: var(--accent-bright); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .gallery-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
        .gallery-info { padding: 20px; font-size: 13.5px; color: #cbb2ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(10, 7, 22, 0.9); border-top: 1px solid rgba(157, 78, 221, 0.1); }
    </style>
</head>
<body>
    <div class="cosmic-bg"></div>
    <div class="lightning-storm"></div>
    <div class="fog-bottom"></div>
    <header>
        <div class="logo">PulseGenerate</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('studio')">ИИ Студия</button>
            <button class="tab-btn" onclick="switchTab('gallery')">Галерея</button>
        </div>
    </header>
    <div class="container">
        <div id="studio-panel" class="app-panel active">
            <div class="studio-layout">
                <div class="control-box">
                    <div class="box-title">Параметры генерации</div>
                    <div class="form-group">
                        <label for="prompt">Текстовый запрос (Промпт)</label>
                        <textarea id="prompt">Vibrant 2D cartoon animation artwork. Rick Sanchez from Rick and Morty, exact show style, clean black ink lineart, solid color fill, absolutely no face shadows. Expression of pure shock, huge round cartoon white eyes with tiny dot pupils, wide open mouth. Bright cyan blue spiky hair. Wearing his white lab coat and blue shirt. The background is a masterfully detailed cosmic storm: massive, intense, blinding neon purple and white lightning bolts bursting in the exact shape of a large heart. Thick, luminous, voluminous purple smoke and glowing neon fog swirling dynamically at the bottom of the frame. High contrast, electric atmosphere, rich vivid colors, crisp details. NO 3D, NO REALISM, FLAT CHARACTER.</textarea>
                    </div>
                    <div class="form-group">
                        <label for="style">Визуальный стиль</label>
                        <select id="style" class="style-select">
                            <option value="cartoon">Мультфильм / 2D Cartoon (Канон)</option>
                            <option value="cyberpunk">Киберпанк / Электрический Неон</option>
                            <option value="fantasy">Эпичное Фэнтези / Глубокий Реализм</option>
                        </select>
                    </div>
                    <button id="gen-btn" class="generate-btn" onclick="generateImage()">Генерировать шедевр</button>
                </div>
                <div class="result-box">
                    <div class="box-title">Результат генерации</div>
                    <div class="preview-container" id="preview-wrapper">
                        <div id="loader" class="loader"></div>
                        <div id="placeholder" class="placeholder-text">Напишите запрос и запустите нейросеть.<br>Сайт подключен к скоростной модели FLUX без ограничений.</div>
                        <img id="output-img" class="preview-img" src="" alt="Результат">
                    </div>
                    <div class="action-buttons">
                        <a id="dl-btn" class="download-btn" target="_blank" download="pulse-generate-art.jpg">Скачать арт в HD</a>
                    </div>
                </div>
            </div>
        </div>
        <div id="gallery-panel" class="app-panel">
            <div class="gallery-grid" id="gallery-container"></div>
        </div>
    </div>
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.app-panel').forEach(panel => panel.classList.remove('active'));
            if(window.event && window.event.target) window.event.target.classList.add('active');
            document.getElementById(tabId + '-panel').classList.add('active');
            if(tabId === 'gallery') renderGallery();
        }
        async function generateImage() {
            const promptText = document.getElementById('prompt').value;
            const styleSelect = document.getElementById('style').value;
            const genBtn = document.getElementById('gen-btn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder');
            const outputImg = document.getElementById('output-img');
            const dlBtn = document.getElementById('dl-btn');
            const wrapper = document.getElementById('preview-wrapper');
            if (!promptText.trim()) return;
            genBtn.disabled = true;
            genBtn.innerText = "ИИ материализует арт...";
            placeholder.style.display = "none";
            wrapper.classList.remove('active');
            dlBtn.style.display = "none";
            loader.style.display = "block";
            let finalPrompt = promptText;
            if (styleSelect === 'cyberpunk') finalPrompt += ", cyberpunk vaporwave style, glowing detailed electricity, hyper neon purple";
            if (styleSelect === 'fantasy') finalPrompt += ", cinematic concept art, highly detailed masterwork, dramatic dark lighting";
            const randomSeed = Math.floor(Math.random() * 99999999);
            const apiUrl = 'https://image.pollinations.ai/p/' + encodeURIComponent(finalPrompt) + '?width=1024&height=1024&seed=' + randomSeed + '&model=flux&nologo=true';
            try {
                const img = new Image();
                img.src = apiUrl;
                img.crossOrigin = "anonymous";
                img.onload = function() {
                    loader.style.display = "none";
                    outputImg.src = apiUrl;
                    wrapper.classList.add('active');
                    dlBtn.href = apiUrl;
                    dlBtn.style.display = "block";
                    saveToLocalGallery(apiUrl, promptText);
                    genBtn.disabled = false;
                    genBtn.innerText = "Генерировать шедевр";
                };
            } catch (error) {
                alert("Ошибка связи с ИИ. Попробуйте нажать кнопку еще раз.");
                loader.style.display = "none";
                placeholder.style.display = "block";
                genBtn.disabled = false;
                genBtn.innerText = "Генерировать шедевр";
            }
        }
        function saveToLocalGallery(url, prompt) {
            let items = JSON.parse(localStorage.getItem('my_ai_gallery')) || [];
            items.unshift({ url: url, prompt: prompt });
            localStorage.setItem('my_ai_gallery', JSON.stringify(items));
        }
        function renderGallery() {
            const container = document.getElementById('gallery-container');
            let items = JSON.parse(localStorage.getItem('my_ai_gallery')) || [];
            if(items.length === 0) {
                container.innerHTML = '<div style="color:var(--text-muted); text-align:center; grid-column: 1/-1; padding: 60px; font-size: 15px;">Ваша галерея пуста. Создайте свой первый неоновый шедевр!</div>';
                return;
            }
            container.innerHTML = items.map(function(item) {
                return '<div class="gallery-item" onclick="window.open('' + item.url + '', '_blank')">' +
                    '<img src="' + item.url + '" alt="AI Art">' +
                    '<div class="gallery-info">' + item.prompt + '</div>' +
                '</div>';
            }).join('');
        }
    </script>
</body>
</html>
