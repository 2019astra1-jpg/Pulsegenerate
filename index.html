<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseGenerate - AI Studio</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: #13131a;
            --accent-purple: #9d4edd;
            --accent-neon: #e0aaff;
            --text-color: #f8f9fa;
            --text-muted: #8c8c9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Эпичный живой фон с неоновой грозой */
        .lightning-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 30%, #1a0933 0%, #0b0b0e 70%);
            opacity: 0.8;
        }

        .lightning-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(157, 78, 221, 0.0);
            animation: lightning-flash 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes lightning-flash {
            0%, 92%, 94%, 96%, 100% { background: rgba(157, 78, 221, 0.0); }
            93% { background: rgba(224, 170, 255, 0.15); filter: blur(2px); }
            95% { background: rgba(157, 78, 221, 0.08); }
        }

        header {
            background: rgba(19, 19, 26, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(157, 78, 221, 0.3);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(45deg, var(--accent-purple), var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.6);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 8px 22px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--text-color);
            border-color: rgba(157, 78, 221, 0.4);
        }

        .tab-btn.active {
            color: var(--text-color);
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.6);
        }

        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .app-panel {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .app-panel.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .studio-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 900px) {
            .studio-layout { grid-template-columns: 1fr; }
        }

        .control-box, .result-box {
            background: var(--panel-bg);
            border: 1px solid rgba(157, 78, 221, 0.2);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
        }

        .box-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--accent-neon);
            border-left: 4px solid var(--accent-purple);
            padding-left: 12px;
        }

        .form-group { margin-bottom: 22px; }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #cbb2ff;
        }

        textarea {
            width: 100%;
            height: 160px;
            background: #171721;
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 10px;
            padding: 14px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: all 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-neon);
            box-shadow: 0 0 10px rgba(157, 78, 221, 0.2);
        }

        .style-select {
            width: 100%;
            background: #171721;
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 10px;
            padding: 14px;
            color: var(--text-color);
            cursor: pointer;
            outline: none;
            font-size: 14px;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-purple), #7b2cbf);
            color: var(--text-color);
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(157, 78, 221, 0.4);
            margin-top: auto;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(157, 78, 221, 0.7);
        }

        .generate-btn:disabled {
            background: #2a2a38;
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .preview-container {
            width: 100%;
            aspect-ratio: 1/1;
            background: #0f0f14;
            border: 2px dashed rgba(157, 78, 221, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            animation: imgActive 0.5s ease forwards;
        }

        @keyframes imgActive {
            to { filter: drop-shadow(0 0 20px rgba(157, 78, 221, 0.5)); }
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            padding: 30px;
            font-size: 14px;
            line-height: 1.6;
        }

        .loader {
            display: none;
            width: 60px;
            height: 60px;
            border: 4px solid transparent;
            border-top-color: var(--accent-purple);
            border-bottom-color: var(--accent-neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }

        .download-btn {
            display: none;
            flex: 1;
            background: #242433;
            color: #fff;
            border: 1px solid rgba(157, 78, 221, 0.4);
            padding: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .download-btn:hover {
            background: rgba(157, 78, 221, 0.2);
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .gallery-item {
            background: var(--panel-bg);
            border: 1px solid rgba(157, 78, 221, 0.15);
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            border-color: var(--accent-neon);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
        }

        .gallery-info {
            padding: 15px;
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #161622;
        }
    </style>
</head>
<body>

    <div class="lightning-bg"></div>

    <header>
        <div class="logo">PulseGenerate</div>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('studio')">ИИ Студия</button>
            <button class="tab-btn" onclick="switchTab('gallery')">Галерея</button>
        </div>
    </header>

    <div class="container">
